{% extends "base/base_list.html" %}
{% load gloval_tags %}
	{% block headextra %}
	{% endblock headextra %}
	{% block bodylist %}
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Opciones</th>
                </tr>
            </thead>
            <tbody>
                {% for object in object_list %}
                    <tr id='{{ object.id}}' class="target-blink">
                        <td>{{ object.id }}</td>
                        <td>{{ object.nombre }}</td>
                        <td>
                            <div class="btn-group" role="group" aria-label="Basic example">
                                <a type="button" class="btn btn-primary" href="{% url 'controlm:controltipo_list' object.id %}">
                                    <i class="fa-solid fa-pen-to-square"></i> Tipos
                                </a>
                            </div>
                        </td>
                    </tr>
                {% endfor %}    
            </tbody>
        </table>    
    {% endblock bodylist %}
